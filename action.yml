name: PatchPilot dependency scan
description: Scan Python dependency manifests for known vulnerabilities (OSV.dev, EPSS, CISA KEV) and upload SARIF to GitHub code scanning.
author: PatchPilot
branding:
  icon: shield
  color: green
inputs:
  path:
    description: Folder or manifest file to scan, relative to the repository root.
    required: false
    default: "."
  fail-on:
    description: Fail the step when a finding is at least this severe (low, moderate, high, critical, none).
    required: false
    default: high
  format:
    description: Report format written to the output file (sarif, cyclonedx, json, table).
    required: false
    default: sarif
  output:
    description: Report file path.
    required: false
    default: patchpilot.sarif
  ignore:
    description: Advisory ids or aliases to ignore, separated by spaces or commas.
    required: false
    default: ""
  upload-sarif:
    description: Upload the report to GitHub code scanning (needs format sarif and permissions security-events write).
    required: false
    default: "true"
  python-version:
    description: Python used to run the scanner.
    required: false
    default: "3.12"
outputs:
  exit-code:
    description: 0 clean, 1 findings at or above fail-on, 2 scan error.
    value: ${{ steps.scan.outputs.exit-code }}
  report:
    description: Path of the report file.
    value: ${{ inputs.output }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install PatchPilot
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Scan dependencies
      id: scan
      shell: bash
      env:
        PP_PATH: ${{ inputs.path }}
        PP_FAIL_ON: ${{ inputs.fail-on }}
        PP_FORMAT: ${{ inputs.format }}
        PP_OUTPUT: ${{ inputs.output }}
        PP_IGNORE: ${{ inputs.ignore }}
      run: |
        args=()
        for id in ${PP_IGNORE//,/ }; do args+=(--ignore "$id"); done
        set +e
        # one scan: the report is written even when findings fail the threshold (exit 1)
        python -m patchpilot scan "$PP_PATH" --format "$PP_FORMAT" --output "$PP_OUTPUT" --fail-on "$PP_FAIL_ON" "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.format == 'sarif' && hashFiles(inputs.output) != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: patchpilot
    - name: Enforce fail-on
      if: ${{ steps.scan.outputs.exit-code != '0' }}
      shell: bash
      run: |
        echo "PatchPilot exit code ${{ steps.scan.outputs.exit-code }} (1 = findings at or above '${{ inputs.fail-on }}', 2 = scan error)"
        exit ${{ steps.scan.outputs.exit-code }}
