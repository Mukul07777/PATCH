# Packaging for `pip install .` (GitHub Action, pre-commit hook). The app itself pins its deps in requirements.txt.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.4.0"
description = "Python dependency vulnerability scanner (OSV.dev, EPSS, CISA KEV) with SARIF / CycloneDX output and an LLM fix agent"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "packaging>=23",
    "cvss>=3.1",
]

[project.scripts]
patchpilot = "patchpilot.__main__:main"

[tool.setuptools]
packages = ["patchpilot", "patchpilot.core", "patchpilot.intel", "patchpilot.intel.exploits", "patchpilot.agent", "patchpilot.app"]
