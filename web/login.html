<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PatchPilot</title>
<meta name="description" content="Sign in to PatchPilot.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>
<header class="topbar"></header>

<main id="main">
<div class="page-head"><span class="kicker">Account</span></div>
<div class="wrap">
  <form id="authForm" class="card glass fm au-card" data-mode="login" novalidate aria-labelledby="authTitle">
    <h1 id="authTitle">Sign in</h1>
    <p class="muted">Use the account your PatchPilot admin created for you.</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p class="pj-err" id="authErr" role="alert" hidden></p>
    <div class="pj-actions"><button class="btn-cta" type="submit" id="authBtn">Sign in</button></div>
  </form>
</div>
</main>

<footer class="foot" data-site-foot></footer>
<script src="/static/site.js"></script>
<script src="/static/auth.js"></script>
</body>
</html>
